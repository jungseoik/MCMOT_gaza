<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BoostTrack Live Tracking</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --fg:#e6edf3; --muted:#8b949e;
          --accent:#2f81f7; --ok:#3fb950; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:18px 24px; border-bottom:1px solid #21262d; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  main { max-width:1000px; margin:0 auto; padding:24px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  input[type=file] { color:var(--muted); }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:9px 16px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .stage { margin-top:20px; background:var(--panel); border:1px solid #21262d;
           border-radius:10px; padding:16px; }
  .view { width:100%; background:#000; border-radius:8px; display:block;
          aspect-ratio:16/9; object-fit:contain; }
  .hidden { display:none; }
  .statusbar { display:flex; justify-content:space-between; align-items:center;
               margin-bottom:12px; font-size:13px; }
  .badge { padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .badge.processing { background:rgba(47,129,247,.15); color:var(--accent); }
  .badge.done { background:rgba(63,185,80,.15); color:var(--ok); }
  .badge.error { background:rgba(248,81,73,.15); color:var(--err); }
  .badge.queued { background:rgba(139,148,158,.15); color:var(--muted); }
  .bar { height:6px; background:#21262d; border-radius:999px; overflow:hidden; margin-top:4px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  .muted { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>BoostTrack — Live TRT Tracking</h1>
  <p>비디오를 업로드하면 추론되는 대로 실시간 표시하고, 완료되면 결과를 반복 재생합니다.</p>
</header>
<main>
  <div class="row">
    <input id="file" type="file" accept="video/*" />
    <button id="go">업로드 &amp; 추론</button>
    <span id="hint" class="muted"></span>
  </div>

  <div id="stage" class="stage hidden">
    <div class="statusbar">
      <div>
        <span id="badge" class="badge queued">queued</span>
        <span id="meta" class="muted"></span>
      </div>
      <span id="phase" class="muted"></span>
    </div>
    <div class="bar"><div id="prog"></div></div>
    <div style="margin-top:12px;">
      <!-- single MJPEG view: live during processing, then loops the result -->
      <img id="live" class="view" alt="tracking view" />
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let pollTimer = null;

$("go").addEventListener("click", async () => {
  const f = $("file").files[0];
  if (!f) { $("hint").textContent = "비디오 파일을 먼저 선택하세요."; return; }

  $("go").disabled = true;
  $("hint").textContent = "업로드 중...";
  resetStage();

  const fd = new FormData();
  fd.append("file", f);
  let job;
  try {
    const r = await fetch("/upload", { method: "POST", body: fd });
    if (!r.ok) throw new Error("upload failed: " + r.status);
    job = (await r.json()).job_id;
  } catch (e) {
    $("hint").textContent = "오류: " + e.message;
    $("go").disabled = false;
    return;
  }

  $("hint").textContent = "";
  $("stage").classList.remove("hidden");
  // start live stream (frames appear as they are processed)
  $("live").src = "/stream/" + job + "?t=" + Date.now();
  poll(job);
});

function resetStage() {
  clearInterval(pollTimer);
  $("live").removeAttribute("src");
  setBadge("queued");
  $("meta").textContent = "";
  $("phase").textContent = "";
  $("prog").style.width = "0";
}

function setBadge(s) {
  const b = $("badge");
  b.className = "badge " + s;
  b.textContent = s;
}

function poll(job) {
  pollTimer = setInterval(async () => {
    let s;
    try {
      s = await (await fetch("/status/" + job)).json();
    } catch (e) { return; }

    setBadge(s.status);
    const pct = s.total ? Math.round((s.processed / s.total) * 100) : 0;
    $("prog").style.width = pct + "%";
    $("meta").textContent =
      `${s.processed}${s.total ? " / " + s.total : ""} frames`
      + (s.fps ? `  ·  src ${s.fps}fps` : "");

    if (s.status === "processing") {
      $("phase").textContent = "추론 중 (라이브)";
    } else if (s.status === "done") {
      clearInterval(pollTimer);
      $("phase").textContent = "완료 · 반복 재생";
      $("prog").style.width = "100%";
      // reconnect the same <img>: server now loops the result from frame 0
      $("live").src = "/stream/" + job + "?replay=" + Date.now();
      $("go").disabled = false;
    } else if (s.status === "error") {
      clearInterval(pollTimer);
      $("phase").textContent = "오류: " + (s.error || "unknown");
      $("go").disabled = false;
    }
  }, 1000);
}
</script>
</body>
</html>
